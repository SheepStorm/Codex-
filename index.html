<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Up - Brain Training</title>
    <style>
      :root {
        --bg: #1d1d1d;
        --accent: #fef500;
        --text-main: #ffffff;
        --text-sub: #888888;
        --success: #00c853;
        --danger: #e92222;
        --basic: #00c853;
        --advanced: #2979ff;
        --pro: #d500f9;
      }
      * { box-sizing: border-box; }
      html, body, #root { margin: 0; width: 100%; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
          'Noto Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        background: var(--bg);
        color: var(--text-main);
        overflow: hidden;
      }
      button { font-family: inherit; }
      .page { width: 100%; height: 100%; position: relative; }

      .home {
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #2a2a00 0%, #1d1d1d 65%);
      }
      .home-inner { text-align: center; padding: 24px; }
      .brain-wrap {
        width: 130px;
        margin: 0 auto 22px;
        animation: float 2.8s ease-in-out infinite;
        filter: drop-shadow(0 0 14px rgba(254, 245, 0, 0.45));
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      .main-title {
        margin: 0;
        font-weight: 900;
        letter-spacing: 1.8px;
        font-size: clamp(38px, 8vw, 74px);
      }
      .main-title span { color: var(--accent); }
      .subtitle { color: var(--text-sub); margin: 14px 0 30px; font-size: clamp(14px, 2.3vw, 18px); }
      .cta {
        border: none;
        background: var(--accent);
        color: #111;
        border-radius: 999px;
        font-weight: 700;
        cursor: pointer;
        padding: 14px 24px;
        min-width: 240px;
        font-size: 16px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .cta:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 24px rgba(254, 245, 0, 0.28);
      }

      .list-page { padding: 20px clamp(16px, 4vw, 40px); overflow-y: auto; }
      .top-row { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
      .back {
        border: 1px solid #3b3b3b;
        border-radius: 12px;
        background: #252525;
        color: var(--text-main);
        padding: 8px 12px;
        cursor: pointer;
      }
      .list-title { margin: 8px 0 4px; font-size: clamp(28px, 5vw, 42px); font-weight: 900; }
      .list-sub { color: var(--text-sub); margin-bottom: 20px; }
      .cards { display: grid; gap: 14px; max-width: 960px; margin: 0 auto; padding-bottom: 28px; }
      .card {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        padding: 18px;
        background: #252525;
        border: 1px solid #363636;
        border-radius: 16px;
        cursor: pointer;
        transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
      }
      .card:hover {
        transform: scale(1.015);
        border-color: var(--accent);
        box-shadow: 0 8px 20px rgba(0,0,0,0.35);
      }
      .card h3 { margin: 0 0 6px; font-size: 22px; }
      .card p { margin: 0; color: #b8b8b8; font-size: 14px; }
      .count { font-size: 13px; color: var(--text-sub); margin-top: 6px; }
      .tag { font-size: 12px; color: #111; background: var(--accent); border-radius: 999px; padding: 4px 10px; font-weight: 700; }
      .icon {
        width: 42px; height: 42px; border-radius: 12px;
        display: grid; place-items: center;
        border: 1px solid currentColor;
        font-weight: 800;
      }

      .training-page { display: flex; flex-direction: column; height: 100%; padding: 14px 12px 8px; }
      .training-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .training-info h3 { margin: 0 0 4px; font-size: clamp(17px, 2.5vw, 22px); }
      .training-info p { margin: 0; color: var(--text-sub); font-size: 13px; }
      .dots { display: flex; gap: 6px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #4b4b4b; }
      .dot.active { background: var(--accent); }
      .dot.done { background: var(--success); }

      .training-main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: center;
        min-height: 0;
        margin-top: 8px;
      }
      .grid-wrap {
        height: 100%;
        display: grid;
        place-items: center;
      }
      .grid {
        width: min(88vw, calc(100vh - 140px));
        height: min(88vw, calc(100vh - 140px));
        max-width: 980px;
        max-height: 980px;
        background: #242424;
        border: 1px solid #363636;
        border-radius: 14px;
        padding: 8px;
        display: grid;
        gap: 6px;
        user-select: none;
      }
      .cell {
        background: #2f2f2f;
        border: 1px solid #3a3a3a;
        border-radius: 10px;
        display: grid;
        place-items: center;
        font-weight: 900;
        cursor: pointer;
        transition: transform 0.12s ease, background 0.16s ease, border-color 0.16s ease;
      }
      .cell:hover { transform: scale(0.985); border-color: #5a5a5a; }
      .cell.done {
        background: rgba(0, 200, 83, 0.2);
        border-color: var(--success);
        color: var(--success) !important;
      }
      .side-control {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding-right: 2px;
      }
      .timer { font-variant-numeric: tabular-nums; font-weight: 700; color: #d3d3d3; }
      .start-stop {
        width: 88px;
        height: 88px;
        border: none;
        border-radius: 50%;
        color: #fff;
        font-size: 17px;
        font-weight: 800;
        cursor: pointer;
      }
      .target {
        text-align: center;
        margin: 8px 0 2px;
        color: #dadada;
        font-weight: 600;
      }
      .highlight { color: var(--accent); font-weight: 800; }
      .hl { color: var(--accent); font-weight: 900; font-size: 1.22em; }

      .stroop-board {
        width: min(92vw, calc(100vh - 170px));
        height: min(92vw, calc(100vh - 170px));
        max-width: 980px;
        max-height: 980px;
        background: #242424;
        border: 1px solid #363636;
        border-radius: 14px;
        padding: 10px;
        display: grid;
        gap: 8px;
        align-content: center;
      }
      .stroop-cell {
        background: #2f2f2f;
        border: 1px solid #3a3a3a;
        border-radius: 10px;
        display: grid;
        place-items: center;
        font-weight: 900;
        opacity: 0.35;
        transition: opacity 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
      }
      .stroop-cell.active {
        opacity: 1;
        transform: scale(1.03);
        border-color: var(--accent);
      }

      .stroop-advanced {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background:
          linear-gradient(rgba(255, 0, 90, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 0, 90, 0.08) 1px, transparent 1px),
          radial-gradient(circle at center, #2a0019 0%, #17000d 55%, #13000a 100%);
        background-size: 42px 42px, 42px 42px, auto;
        border: 1px solid #3b1a2a;
      }
      .stroop-group {
        display: grid;
        grid-template-columns: repeat(3, minmax(70px, 1fr));
        gap: clamp(12px, 2vw, 30px);
        align-items: start;
        width: min(720px, 86vw);
      }
      .stroop-item-wrap {
        display: grid;
        justify-items: center;
        gap: 8px;
      }
      .stroop-arrow {
        min-height: 34px;
        font-size: clamp(64px, 9vw, 104px);
        color: #f8f8f8;
        font-weight: 900;
        text-shadow: 0 0 26px rgba(255, 255, 255, 0.42);
        line-height: 0.9;
      }
      .stroop-word {
        width: 100%;
        min-height: clamp(110px, 16vh, 170px);
        display: grid;
        place-items: center;
        font-size: clamp(76px, 11vw, 160px);
        font-weight: 900;
        text-shadow: 0 16px 0 rgba(0, 0, 0, 0.28), 0 0 16px rgba(255, 255, 255, 0.08);
      }

      .nback-shell {
        width: min(90vw, 760px);
        min-height: min(72vh, 700px);
        background: #242424;
        border: 1px solid #3b3b3b;
        border-radius: 16px;
        padding: clamp(14px, 2.2vw, 24px);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 16px;
      }
      .nback-stats {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        color: #d6d6d6;
        font-size: 14px;
      }
      .nback-stats b { color: var(--accent); font-size: 20px; font-variant-numeric: tabular-nums; }
      .nback-equation {
        text-align: center;
        font-family: 'Courier New', Courier, monospace;
        font-size: clamp(44px, 9vw, 82px);
        font-weight: 900;
        letter-spacing: 2px;
      }
      .nback-instruction { text-align: center; color: #b6b6b6; min-height: 22px; }
      .nback-input-row {
        display: flex;
        justify-content: center;
        gap: 10px;
      }
      .nback-input {
        width: 180px;
        text-align: center;
        background: #1f1f1f;
        color: #fff;
        border: 2px solid #3f3f3f;
        border-radius: 10px;
        font-size: 26px;
        padding: 10px;
      }
      .nback-input:focus { border-color: var(--accent); outline: none; }
      .nback-input.correct { border-color: #00c853; }
      .nback-input.wrong { border-color: #e92222; }
      .nback-submit {
        border: none;
        border-radius: 10px;
        background: #2979ff;
        color: #fff;
        font-weight: 800;
        padding: 0 18px;
        font-size: 18px;
      }
      .nback-start-btn {
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: #111;
        font-weight: 800;
        font-size: 16px;
        padding: 10px 16px;
        width: fit-content;
        margin: 0 auto;
      }
      .nback-keypad {
        display: grid;
        grid-template-columns: repeat(3, minmax(64px, 1fr));
        gap: 10px;
        max-width: 320px;
        margin: 0 auto;
      }
      .nback-key {
        border: 1px solid #5a5a5a;
        border-radius: 10px;
        background: #2a2a2a;
        color: #fff;
        font-size: 24px;
        font-weight: 800;
        padding: 12px 0;
      }
      .nback-key:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .seq-stage {
        width: min(90vw, 700px);
        min-height: min(68vh, 560px);
        display: grid;
        place-items: center;
        border-radius: 16px;
        border: 1px solid #353535;
        background: #232323;
      }
      .seq-char {
        font-size: clamp(72px, 14vw, 150px);
        font-weight: 900;
        color: #fff;
        letter-spacing: 4px;
      }
      .seq-input-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(54px, 1fr));
        gap: 10px;
        margin: 10px 0 6px;
      }
      .seq-input {
        width: 100%;
        text-align: center;
        background: #1c1c1c;
        color: #fff;
        border: 2px solid #424242;
        border-radius: 8px;
        font-size: 24px;
        font-weight: 700;
        padding: 10px 6px;
      }
      .seq-input.wrong { border-color: #e92222; color: #ff8a8a; }
      .seq-answer { margin-top: 8px; color: #c8c8c8; font-size: 14px; }
      .seq-slot {
        width: 100%;
        text-align: center;
        background: #1c1c1c;
        color: #fff;
        border: 2px solid #424242;
        border-radius: 8px;
        font-size: 24px;
        font-weight: 700;
        padding: 10px 6px;
        min-height: 56px;
        display: grid;
        place-items: center;
      }
      .seq-slot.wrong { border-color: #e92222; color: #ff8a8a; }
      .seq-option-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(52px, 1fr));
        gap: 8px;
        margin-top: 10px;
      }
      .seq-option {
        border: 1px solid #5a5a5a;
        border-radius: 8px;
        background: #2a2a2a;
        color: #fff;
        font-size: 20px;
        font-weight: 700;
        padding: 8px;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: grid;
        place-items: center;
        padding: 14px;
        z-index: 10;
        animation: fadeIn 0.2s ease;
      }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .modal {
        width: min(94vw, 560px);
        background: #242424;
        border: 1px solid #414141;
        border-radius: 16px;
        padding: 22px 20px;
      }
      .play { color: var(--accent); font-size: 26px; }
      .modal h2 { margin: 8px 0 10px; font-size: 30px; font-weight: 900; }
      .modal p { margin: 0 0 10px; color: #d7d7d7; line-height: 1.55; }
      .poem-full {
        margin-top: 8px;
        padding: 10px;
        border-radius: 10px;
        background: #1a1a1a;
        color: #bbbbbb;
        font-size: 13px;
      }
      .tip { margin-top: 10px; font-size: 12px; color: #8a8a8a; }
      .next-btn {
        margin-top: 14px;
        border: none;
        background: var(--accent);
        color: #111;
        font-weight: 800;
        border-radius: 999px;
        padding: 10px 18px;
        cursor: pointer;
      }

      @media (max-width: 900px) {
        .training-main { grid-template-columns: 1fr; }
        .side-control {
          position: fixed;
          right: 14px;
          bottom: 20px;
          z-index: 3;
          padding-right: 0;
        }
        .grid {
          width: min(95vw, calc(100vh - 210px));
          height: min(95vw, calc(100vh - 210px));
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

                { id: 'sm-i-a1', label: '双任务干扰1', variant: 'dual-task', contentType: 'mixed', length: 6, order: 'forward', distractorCount: 2 },
                { id: 'sm-i-a2', label: '双任务干扰2', variant: 'dual-task', contentType: 'mixed', length: 7, order: 'forward', distractorCount: 3 },
                { id: 'sm-i-a3', label: '双任务干扰3', variant: 'dual-task', contentType: 'mixed', length: 7, order: 'reverse', distractorCount: 3 },
                { id: 'sm-i-c1', label: '滑动窗口1', variant: 'running-span', contentType: 'mixed', streamLength: 10, recallLength: 5 },
                { id: 'sm-i-c2', label: '滑动窗口2', variant: 'running-span', contentType: 'mixed', streamLength: 12, recallLength: 6 },
                { id: 'sm-i-b1', label: '规则切换1', variant: 'rule-switch', contentType: 'mixed', length: 6, transform: 'forward' },
                { id: 'sm-i-b2', label: '规则切换2', variant: 'rule-switch', contentType: 'mixed', length: 6, transform: 'reverse' },
                { id: 'sm-i-b3', label: '规则切换3', variant: 'rule-switch', contentType: 'mixed', length: 6, transform: 'letter-first' },
              ],
            },
            { id: 'sm-advanced', name: '高级', color: '#d500f9', gridSize: 1, status: 'coming-soon', trainings: [{ id: 'sm-a-1', label: '敬请期待' }] },
          ],
        },
      };

      const COLOR_POOL = ['#ff6d00','#ff1744','#00e676','#00b0ff','#ffea00','#651fff','#ff9100','#18ffff','#d500f9','#64dd17'];
      const FILLER_CHARS = '天地人心山水风花雪月春夏秋冬日云海星光明德智勇和乐安宁学思行志'.split('');
      const STROOP_COLOR_WORDS = ['白', '红', '黄', '绿', '蓝', '紫'];
      const STROOP_COLOR_MAP = {
        白: '#ffffff',
        红: '#e92222',
        黄: '#fef500',
        绿: '#00c853',
        蓝: '#2979ff',
        紫: '#d500f9',
      };
      const STROOP_DISTRACTORS = ['七', '川', '非', '中', '井', '由', '甲', '申', '早', '未', '末', '才', '文'];

      const shuffle = (arr) => {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      };

      const range = (start, end) => Array.from({ length: end - start + 1 }, (_, i) => start + i);

      function pickRandom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function createStroopToken(withRandomChar) {
        const text = withRandomChar ? pickRandom(STROOP_DISTRACTORS) : pickRandom(STROOP_COLOR_WORDS);
        const colorWord = pickRandom(STROOP_COLOR_WORDS.filter((c) => c !== text));
        return { text, colorWord, color: STROOP_COLOR_MAP[colorWord] };
      }

      function createStroopBasicSet(rows, cols) {
        return Array.from({ length: rows * cols }, () => createStroopToken(false));
      }

      function createStroopIntermediateSet(rows, cols, maxRandomChars) {
        const total = rows * cols;
        const baselineRandomCount = Math.floor(total / 3);
        const randomCount = Math.min(total, Math.max(baselineRandomCount, maxRandomChars || 0));
        const randomIndices = new Set(shuffle(range(0, total - 1)).slice(0, randomCount));
        return Array.from({ length: total }, (_, idx) => createStroopToken(randomIndices.has(idx)));
      }

      function createStroopAdvancedGroups(totalGroups, allowRandomChars, maxRandomChars) {
        const randomGroupCount = allowRandomChars ? Math.min(maxRandomChars, Math.floor(Math.random() * (maxRandomChars + 1))) : 0;
        const randomGroupIndices = new Set(shuffle(range(0, totalGroups - 1)).slice(0, randomGroupCount));
        return Array.from({ length: totalGroups }, (_, groupIndex) => {
          const withRandom = randomGroupIndices.has(groupIndex);
          const words = Array.from({ length: 3 }, () => createStroopToken(withRandom));
          return {
            words,
            targetIndex: Math.floor(Math.random() * 3),
          };
        });
      }

      function generateNBackQuestion(id, maxResult) {
        const isAdd = Math.random() < 0.5;
        let a;
        let b;
        let op;
        let answer;
        if (isAdd) {
          a = Math.floor(Math.random() * (maxResult + 1));
          b = Math.floor(Math.random() * (maxResult - a + 1));
          op = '+';
          answer = a + b;
        } else {
          a = Math.floor(Math.random() * (maxResult + 1));
          b = Math.floor(Math.random() * (a + 1));
          op = '-';
          answer = a - b;
        }
        return { id, a, b, op, answer, text: `${a} ${op} ${b} = ?` };
      }

      function createSequenceMemoryChars(contentType, length) {
        const numbers = '0123456789'.split('');
        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        const pool = contentType === 'number' ? numbers : contentType === 'letter' ? letters : [...numbers, ...letters];
        const result = [];
        for (let i = 0; i < length; i++) {
          const prev = result[i - 1];
          const candidates = prev == null ? pool : pool.filter((c) => c !== prev);
          result.push(pickRandom(candidates));
        }
        return result;
      }

      function normalizeSequenceValue(v) {
        return String(v || '').trim().toUpperCase();
      }

      function transformSequenceForRule(sequence, transform) {
        if (transform === 'reverse') return [...sequence].reverse();
        if (transform === 'letter-first') {
          const letters = sequence.filter((char) => /[A-Z]/.test(char));
          const numbers = sequence.filter((char) => /\d/.test(char));
          return [...letters, ...numbers];
        }
        return sequence;
      }

      function createChunkOptionPool(expected, distractorCount) {
        const basePool = Array.from(new Set(expected));
        const mixedPool = Array.from(new Set([...basePool, ...'0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')]));
        const pool = [...basePool];
        const needed = Math.max(0, distractorCount || 0);
        while (pool.length < basePool.length + needed && mixedPool.length) {
          const candidate = pickRandom(mixedPool);
          if (!pool.includes(candidate)) pool.push(candidate);
        }
        return shuffle(pool);
      }

      function createDualTaskPrompts(sequence, count) {
        const source = shuffle(sequence).slice(0, Math.min(sequence.length, Math.max(1, count || 1)));
        return source.map((char) => {
          const askDigit = Math.random() < 0.5;
          return askDigit
            ? { text: `字符 ${char} 是数字吗？`, answer: /\d/.test(char) }
            : { text: `字符 ${char} 是字母吗？`, answer: /[A-Z]/.test(char) };
        });
      }

      function formatChunkPattern(pattern) {
        return (pattern || []).join('-');
      }

      function formatSequenceTrainingDesc(training) {
        if (training.variant === 'dual-task') {
          return `${training.order === 'reverse' ? '倒叙' : '顺序'}复述 ${training.length} 个字符（含干扰题）`;
        }
        if (training.variant === 'running-span') {
          return `连续展示 ${training.streamLength} 个字符后，输入最后 ${training.recallLength} 个`;
        }
        if (training.variant === 'rule-switch') {
          if (training.transform === 'reverse') return '按倒叙输入屏幕中的字符';
          if (training.transform === 'letter-first') return '按“字母在前、数字在后”重排后输入';
          return '按顺序输入屏幕中的字符';
        }
        if (training.variant === 'chunk-reconstruct') {
          return `按分块 ${formatChunkPattern(training.chunkPattern)} 完成重组输入`;
        }
        const contentLabel = training.contentType === 'letter' ? '字母' : training.contentType === 'number' ? '数字' : '数字/字母';
        return `${training.order === 'reverse' ? '倒叙' : '顺序'}复述 ${training.length} 个${contentLabel}`;
      }

      function formatSequencePrepareDesc(training) {
        if (training.variant === 'dual-task') {
          return `展示完成后先回答 ${training.distractorCount || 2} 道干扰题，再按${training.order === 'reverse' ? '倒叙' : '顺序'}输入。`;
        }
        if (training.variant === 'running-span') {
          return `展示完成后请输入最后 ${training.recallLength} 个字符（按出现顺序）。`;
        }
        if (training.variant === 'rule-switch') {
          if (training.transform === 'reverse') return '展示完成后请按倒叙输入。';
          if (training.transform === 'letter-first') return '展示完成后请按“字母在前、数字在后”规则输入。';
          return '展示完成后请按顺序输入。';
        }
        if (training.variant === 'chunk-reconstruct') {
          return `展示完成后请按分块 ${formatChunkPattern(training.chunkPattern)} 规则完成重组。`;
        }
        return `展示完成后请按${training.order === 'reverse' ? '倒叙' : '顺序'}输入。`;
      }

      function formatSequenceInputTitle(training) {
        if (training.variant === 'dual-task') return '请按记忆顺序输入答案';
        if (training.variant === 'running-span') return '请输入最后出现的字符';
        if (training.variant === 'rule-switch') return '请按规则输入答案';
        if (training.variant === 'chunk-reconstruct') return '请点击下方字符完成重组';
        return '请输入答案';
      }

      function formatSequenceTip(training) {
        if (training.variant === 'dual-task') return '先完成干扰题，再输入记忆结果；字母不区分大小写。';
        if (training.variant === 'running-span') return '只输入最后出现的字符；字母不区分大小写。';
        if (training.variant === 'rule-switch') return '字母不区分大小写；填满后自动检测。';
        if (training.variant === 'chunk-reconstruct') return '点击字符依次填入上方空位；填满后自动检测。';
        return '字母不区分大小写；填满后自动检测。';
      }

      function formatTime(ms) {
        const minutes = Math.floor(ms / 60000).toString().padStart(2, '0');
        const seconds = Math.floor((ms % 60000) / 1000).toString().padStart(2, '0');
        const milli = (ms % 1000).toString().padStart(3, '0');
        return `${minutes}:${seconds}.${milli}`;
      }

      function getTrainingRequirement(training) {
        if (training.type === 'number') {
          return training.mode === 'asc' ? `按 ${training.min}-${training.max} 的升序查表` : `按 ${training.max}-${training.min} 的降序查表`;
        }
        if (training.type === 'letter') return '按 A-Y 的顺序查表';
        return `按诗句顺序找出 ${training.poemTitle} 的目标汉字`;
      }

      function createGrid(training, size) {
        const total = size * size;
        if (training.type === 'number') {
          const labels = range(training.min, training.max).map(String);
          const sequence = training.mode === 'asc' ? labels : [...labels].reverse();
          return {
            cells: shuffle(labels.map((label, idx) => ({ id: `n-${idx}`, label, targetKey: label }))),
            sequence,
          };
        }

        if (training.type === 'letter') {
          const labels = range(0, 24).map((i) => String.fromCharCode(65 + i));
          return {
            cells: shuffle(labels.map((label, idx) => ({ id: `l-${idx}`, label, targetKey: label }))),
            sequence: labels,
          };
        }

        const sequence = training.targetSequence;
        const fillers = [];
        while (fillers.length + sequence.length < total) {
          fillers.push(FILLER_CHARS[Math.floor(Math.random() * FILLER_CHARS.length)]);
        }
        const targetCells = sequence.map((char, idx) => ({ id: `p-t-${idx}`, label: char, targetKey: `T${idx}` }));
        const fillerCells = fillers.map((char, idx) => ({ id: `p-f-${idx}`, label: char, targetKey: `F${idx}` }));
        return {
          cells: shuffle([...targetCells, ...fillerCells]),
          sequence: sequence.map((_, idx) => `T${idx}`),
        };
      }

      function BrainIcon() {
        return (
          <div className="brain-wrap" aria-hidden>
            <svg viewBox="0 0 100 100" fill="none" stroke="var(--accent)" strokeWidth="4">
              <path d="M35 20c-8 0-15 7-15 15 0 4 2 8 4 10-5 3-8 8-8 14 0 9 7 16 16 16h8V20h-5Z" />
              <path d="M65 20c8 0 15 7 15 15 0 4-2 8-4 10 5 3 8 8 8 14 0 9-7 16-16 16h-8V20h5Z" />
              <path d="M40 33h20M40 46h20M40 59h20" />
            </svg>
          </div>
        );
      }

      function HomePage({ onSelectTraining }) {
        return (
          <div className="page home">
            <div className="home-inner">
              <BrainIcon />
              <h1 className="main-title">BRAIN <span>TRAINING</span></h1>
              <p className="subtitle">通过科学训练释放你大脑的潜能</p>
              <button className="cta" onClick={onSelectTraining}>请选择训练项目 →</button>
            </div>
          </div>
        );
      }

      function ProjectPage({ onBack, onSelectProject }) {
        return (
          <div className="page list-page">
            <div className="top-row"><button className="back" onClick={onBack}>← 返回</button></div>
            <h2 className="list-title">训练项目选择</h2>
            <div className="list-sub">请选择要进入的训练项目</div>
            <div className="cards">
              {trainingProjects.map((p) => (
                <div key={p.id} className="card" onClick={() => onSelectProject(p)}>
                  <div>
                    <h3 style={{ color: p.color }}>{p.name} <span style={{ color: '#a8a8a8', fontSize: 14 }}> / {p.en}</span></h3>
                    <p>{p.desc}</p>
                    <div className="count">{p.status === 'available' ? '已开放训练' : '开发中，敬请期待'}</div>
                  </div>
                  {p.status === 'available' ? <div className="icon" style={{ color: p.color }}>GO</div> : <span className="tag">即将上线</span>}
                </div>
              ))}
            </div>
          </div>
        );
      }

      function DifficultyPage({ module, onSelectDifficulty, onBack }) {
        return (
          <div className="page list-page">
            <div className="top-row"><button className="back" onClick={onBack}>← 返回</button></div>
            <h2 className="list-title">{module.title}</h2>
            <div className="list-sub">请选择训练难度</div>
            <div className="cards" style={{ maxWidth: 860 }}>
              {module.difficulties.map((d) => (
                <div key={d.id} className="card" onClick={() => d.status !== 'coming-soon' && onSelectDifficulty(d)}>
                  <div>
                    <h3 style={{ color: d.color }}>{d.name}</h3>
                    <p>{module.id === 'stroop' ? `${d.name} Stroop 训练` : module.id === 'nback-math' ? `${d.name} 算术工作记忆` : module.id === 'seq-memory' ? `${d.name} 序列复述训练` : `${d.gridSize} × ${d.gridSize} 表格 · ${d.name}认知训练`}</p>
                    <div className="count">{d.status === 'coming-soon' ? '敬请期待' : `${d.trainings.length} 个训练项目`}</div>
                  </div>
                  {d.status === 'coming-soon' ? <span className="tag">敬请期待</span> : <div className="icon" style={{ color: d.color }}>{d.gridSize}</div>}
                </div>
              ))}
            </div>
          </div>
        );
      }

      function TrainingPage({ difficulty, onBack, onComplete }) {
        const [index, setIndex] = useState(0);
        const [gridData, setGridData] = useState(null);
        const [targetIdx, setTargetIdx] = useState(0);
        const [doneSet, setDoneSet] = useState(new Set());
        const [running, setRunning] = useState(false);
        const [startAt, setStartAt] = useState(0);
        const [elapsed, setElapsed] = useState(0);
        const [showPrepare, setShowPrepare] = useState(true);
        const [showResult, setShowResult] = useState(false);
        const [showUnfinished, setShowUnfinished] = useState(false);
        const [showRestBetweenRounds, setShowRestBetweenRounds] = useState(false);
        const [restSeconds, setRestSeconds] = useState(10);
        const [roundElapsed, setRoundElapsed] = useState(0);

        const currentTraining = difficulty.trainings[index];

        useEffect(() => {
          const newGrid = createGrid(currentTraining, difficulty.gridSize);
          setGridData(newGrid);
          setTargetIdx(0);
          setDoneSet(new Set());
          setRunning(false);
          setStartAt(0);
          setElapsed(0);
          setShowPrepare(true);
          setShowResult(false);
          setShowUnfinished(false);
          setShowRestBetweenRounds(false);
          setRestSeconds(10);
          setRoundElapsed(0);
        }, [index, difficulty]);

        useEffect(() => {
          if (!showRestBetweenRounds) return;
          if (restSeconds <= 0) {
            setShowRestBetweenRounds(false);
            nextTraining();
            return;
          }
          const timer = setTimeout(() => setRestSeconds((s) => s - 1), 1000);
          return () => clearTimeout(timer);
        }, [showRestBetweenRounds, restSeconds]);

        useEffect(() => {
          if (!running) return;
          const timer = setInterval(() => setElapsed(Date.now() - startAt), 31);
          return () => clearInterval(timer);
        }, [running, startAt]);

        useEffect(() => {
          if (!showPrepare) return;
          const onKey = () => setShowPrepare(false);
          window.addEventListener('keydown', onKey);
          return () => window.removeEventListener('keydown', onKey);
        }, [showPrepare]);
        const target = gridData?.sequence[targetIdx] || null;
        const isFinished = !!gridData && targetIdx >= gridData.sequence.length;

        const targetDisplay = useMemo(() => {
          if (!gridData || target == null) return '-';
          if (currentTraining.type === 'poem') {
            const idx = Number(String(target).replace('T', ''));
            return currentTraining.targetSequence[idx] || '-';
          }
          return target;
        }, [target, gridData, currentTraining]);

        function completeTraining() {
          const finalElapsed = running ? Date.now() - startAt : elapsed;
          if (running) {
            setElapsed(finalElapsed);
            setRunning(false);
          }
          setRoundElapsed(finalElapsed);
          if (index < difficulty.trainings.length - 1) {
            setRestSeconds(10);
            setShowRestBetweenRounds(true);
          } else {
            setShowResult(true);
          }
        }

        function handleCellClick(cell) {
          if (!running || !gridData || showPrepare || showResult) return;
          const expected = gridData.sequence[targetIdx];
          const isPoemTraining = currentTraining.type === 'poem';
          if (isPoemTraining) {
            const expectedChar = currentTraining.targetSequence[targetIdx];
            const isTargetCell = cell.id.startsWith('p-t-');
            if (!isTargetCell || doneSet.has(cell.id) || cell.label !== expectedChar) return;
          } else if (cell.targetKey !== expected) {
            return;
          }
          setDoneSet((prev) => {
            const next = new Set(prev);
            next.add(cell.id);
            return next;
          });
          const nextIndex = targetIdx + 1;
          if (nextIndex >= gridData.sequence.length) {
            setTargetIdx(nextIndex);
            setTimeout(completeTraining, 100);
          } else {
            setTargetIdx(nextIndex);
          }
        }

        function nextTraining() {
          if (index < difficulty.trainings.length - 1) {
            setIndex(index + 1);
          } else {
            onComplete();
          }
        }

        const cellFont = `clamp(22px, ${Math.floor(58 / difficulty.gridSize)}vw, ${Math.floor(190 / difficulty.gridSize)}px)`;

        return (
          <div className="page training-page">
            <div className="training-nav">
              <button className="back" onClick={onBack}>← 返回</button>
              <div className="training-info">
                <h3>{difficulty.name} · {currentTraining.label}</h3>
                <p>{getTrainingRequirement(currentTraining)}</p>
              </div>
              <div className="dots">
                {difficulty.trainings.map((_, i) => (
                  <div key={i} className={`dot ${i < index ? 'done' : ''} ${i === index ? 'active' : ''}`} />
                ))}
              </div>
            </div>

            <div className="training-main">
              <div className="grid-wrap">
                {gridData && (
                  <div className="grid" style={{ gridTemplateColumns: `repeat(${difficulty.gridSize}, 1fr)` }}>
                    {gridData.cells.map((cell, i) => (
                      <div
                        key={cell.id}
                        className={`cell ${doneSet.has(cell.id) ? 'done' : ''}`}
                        style={{ fontSize: cellFont, color: currentTraining.colored ? COLOR_POOL[i % COLOR_POOL.length] : '#ffffff' }}
                        onClick={() => handleCellClick(cell)}
                      >
                        {cell.label}
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div className="side-control">
                <div className="timer">{formatTime(elapsed)}</div>
                <button
                  className="start-stop"
                  style={{ background: running ? 'var(--danger)' : 'var(--success)' }}
                  onClick={() => {
                    if (running) {
                      setElapsed(Date.now() - startAt);
                      setRunning(false);
                      if (!isFinished) setShowUnfinished(true);
                    } else if (!isFinished) {
                      setStartAt(Date.now() - elapsed);
                      setRunning(true);
                    }
                  }}
                >
                  {running ? '停止' : '开始'}
                </button>
              </div>
            </div>

            <div className="target">
              当前目标: <span className="highlight">{targetDisplay}</span> ({Math.min(targetIdx + 1, gridData?.sequence.length || 0)}/{gridData?.sequence.length || 0})
            </div>

            {showPrepare && (
              <div className="overlay" onClick={() => setShowPrepare(false)}>
                <div className="modal" onClick={(e) => e.stopPropagation()}>
                  <div className="play">▶</div>
                  <h2>准备好了吗？</h2>
                  <p>
                    训练要求：
                    {currentTraining.type === 'number' && <><span className="highlight"> {currentTraining.mode === 'asc' ? `${currentTraining.min}-${currentTraining.max}` : `${currentTraining.max}-${currentTraining.min}`}</span> <span className="highlight">{currentTraining.mode === 'asc' ? '升序' : '降序'}</span> 查表。</>}
                    {currentTraining.type === 'letter' && <>按 <span className="highlight">A-Y</span> 的 <span className="highlight">顺序</span> 查表。</>}
                    {currentTraining.type === 'poem' && <>按照诗句顺序查找 <span className="highlight">{currentTraining.poemTitle}</span> 目标字。</>}
                  </p>
                  {currentTraining.type === 'poem' && <div className="poem-full">原文：{currentTraining.poemFull}</div>}
                  <div className="tip">点击任意键继续 / 点击下方按钮继续</div>
                  <button className="next-btn" onClick={() => setShowPrepare(false)}>进入训练</button>
                </div>
              </div>
            )}

            {showUnfinished && (
              <div className="overlay" onClick={() => setShowUnfinished(false)}>
                <div className="modal" onClick={(e) => e.stopPropagation()}>
                  <h2 style={{ marginTop: 0 }}>尚未完成</h2>
                  <p>当前训练还没有完成，不能直接结束本题。</p>
                  <p>请继续点击目标项，全部完成后会自动结算。</p>
                  <button className="next-btn" onClick={() => setShowUnfinished(false)}>继续训练</button>
                </div>
              </div>
            )}

            {showResult && (
              <div className="overlay" onClick={onComplete}>
                <div className="modal" onClick={(e) => e.stopPropagation()}>
                  <h2 style={{ marginTop: 0 }}>训练结果</h2>
                  <p>本次用时：<span className="highlight">{formatTime(roundElapsed || elapsed)}</span></p>
                  <button className="next-btn" onClick={onComplete}>返回</button>
                </div>
              </div>
            )}

        function nextTraining() {
          if (index < difficulty.trainings.length - 1) {

          } else {

        useEffect(() => {
          setRunning(false);
          setShowPrepare(true);
          setShowRestBetweenRounds(false);

          setActiveGroupIndex(0);
          setElapsed(0);

            setTokens(createStroopBasicSet(difficulty.view.rows, difficulty.view.cols));
            setGroups([]);

        useEffect(() => {
          if (!running) return;
          const timer = setInterval(() => setElapsed(Date.now() - startAt), 31);
          return () => clearInterval(timer);

        useEffect(() => {
          if (!running || showPrepare || showRestBetweenRounds) return;
          const timer = setInterval(() => {
            if (isAdvanced) {
              setActiveGroupIndex((prev) => {
                if (prev >= groups.length - 1) {
                  clearInterval(timer);
                  setRunning(false);
                  const finalElapsed = Date.now() - startAt;
                  setElapsed(finalElapsed);
                  setRoundElapsed(finalElapsed);
                  if (index < difficulty.trainings.length - 1) {
                    setShowRestBetweenRounds(true);

                  } else {
                    setShowResult(true);
                  }
                  return prev;
                }
                return prev + 1;
              });
            } else {
              setActiveIndex((prev) => {
                if (prev >= tokens.length - 1) {
                  clearInterval(timer);
                  setRunning(false);
                  const finalElapsed = Date.now() - startAt;
                  setElapsed(finalElapsed);
                  setRoundElapsed(finalElapsed);
                  if (index < difficulty.trainings.length - 1) {
                    setShowRestBetweenRounds(true);
                    setRestSeconds(10);
                  } else {
                    setShowResult(true);
                  }
                  return prev;
                }
                return prev + 1;
              });
            }
          }, 1000);
          return () => clearInterval(timer);
        }, [running, showPrepare, showRestBetweenRounds, isAdvanced, tokens.length, groups.length]);

        useEffect(() => {
          if (!showRestBetweenRounds) return;
          if (restSeconds <= 0) {
            setShowRestBetweenRounds(false);
            nextTraining();

          const timer = setTimeout(() => setRestSeconds((s) => s - 1), 1000);
          return () => clearTimeout(timer);

        useEffect(() => {
          if (!showPrepare) return;

          window.addEventListener('keydown', onKey);

            <div className="training-main">

                      <div

                        className={`stroop-cell ${i === activeIndex ? 'active' : ''}`}

                        {token.text}

                {isAdvanced && (
                  <div className="stroop-advanced">
                    <div className="stroop-group">
                      {activeGroup.words.map((_, idx) => (
                        <div key={`arrow-top-${idx}`} className="stroop-item-wrap"><div className="stroop-arrow">{idx === activeGroup.targetIndex ? '↓' : ''}</div></div>
                      ))}
                      {activeGroup.words.map((word, idx) => (

      function NBackMathTrainingPage({ difficulty, onBack, onComplete }) {
        const [showPrepare, setShowPrepare] = useState(true);
        const [running, setRunning] = useState(false);
        const [started, setStarted] = useState(false);
        const [timeLeft, setTimeLeft] = useState(difficulty.view.durationSec);
        const [streak, setStreak] = useState(0);
        const [best, setBest] = useState(0);
        const [currentQ, setCurrentQ] = useState(null);
        const [pendingQ, setPendingQ] = useState(null);
        const [inputValue, setInputValue] = useState('');
        const [lastError, setLastError] = useState(null);
        const [showRoundResult, setShowRoundResult] = useState(false);
        const [resultReason, setResultReason] = useState('');
        const [shownQuestions, setShownQuestions] = useState([]);
        const [answerState, setAnswerState] = useState('idle');
        const streakRef = useRef(0);

        const currentTraining = difficulty.trainings[0];
        const keypadKeys = [1, 2, 3, 4, 5, 6, 7, 8, 9, 0, 10, '⌫'];
        const bestKey = `nback_best_${difficulty.id}`;
        const kBack = difficulty.view.kBack || 1;
        const isTimed = difficulty.view.mode === 'timed';

        useEffect(() => {
          const bestVal = Number(localStorage.getItem(bestKey) || 0);
          setBest(bestVal);
          setShowPrepare(true);
          setRunning(false);
          setStarted(false);
          setTimeLeft(difficulty.view.durationSec || 0);
          setStreak(0);
          streakRef.current = 0;
          const first = generateNBackQuestion(1, difficulty.view.maxResult);
          setCurrentQ(first);
          setShownQuestions([first]);
          setPendingQ(null);
          setInputValue('');
          setLastError(null);
          setShowRoundResult(false);
          setResultReason('');
          setAnswerState('idle');
        }, [difficulty, bestKey]);

        useEffect(() => {
          streakRef.current = streak;
        }, [streak]);

        useEffect(() => {
          if (!running || !isTimed) return;
          const timer = setInterval(() => {
            setTimeLeft((t) => {
              if (t <= 1) {
                clearInterval(timer);
                endRound('时间到，本局结束', null, streakRef.current);
                return 0;
              }
              return t - 1;
            });
          }, 1000);
          return () => clearInterval(timer);
        }, [running, isTimed]);

        useEffect(() => {
          if (!showPrepare) return;
          const onKey = () => setShowPrepare(false);
          window.addEventListener('keydown', onKey);
          return () => window.removeEventListener('keydown', onKey);
        }, [showPrepare]);

        useEffect(() => {
          if (showPrepare || started) return;
          startFirstRound();
        }, [showPrepare, started]);

        useEffect(() => {
          if (!running || !started || !pendingQ) return;
          const raw = inputValue.trim();
          if (raw === '') return;
          const expectedLen = String(Math.abs(pendingQ.answer)).length;
          if (raw.length < expectedLen) return;
          const timer = setTimeout(() => submitAnswer(inputValue), 220);
          return () => clearTimeout(timer);
        }, [inputValue, running, started, pendingQ]);

        function endRound(reasonText, wrongPayload, finalStreak = streakRef.current) {
          setRunning(false);
          setResultReason(reasonText);
          if (wrongPayload) setLastError(wrongPayload);
          setShowRoundResult(true);
          const currentBest = Number(localStorage.getItem(bestKey) || 0);
          if (finalStreak > currentBest) {
            localStorage.setItem(bestKey, String(finalStreak));
            setBest(finalStreak);
          }
        }

        function moveToNextQuestion(baseList) {
          const nextId = baseList.length + 1;
          const nextQ = generateNBackQuestion(nextId, difficulty.view.maxResult);
          const nextList = [...baseList, nextQ];
          setShownQuestions(nextList);
          setCurrentQ(nextQ);
          setPendingQ(nextList.length > kBack ? nextList[nextList.length - 1 - kBack] : null);
        }

        function startFirstRound() {
          setStarted(true);
          setRunning(true);
          moveToNextQuestion(shownQuestions);
        }

        function submitAnswer(rawInput) {
          if (!running || !started || !pendingQ) return;
          const raw = String(rawInput ?? inputValue).trim();
          if (raw === '') return;
          const val = Number(raw);
          if (val === pendingQ.answer) {
            setAnswerState('correct');
            setInputValue('');
            setStreak((v) => {
              const next = v + 1;
              streakRef.current = next;
              return next;
            });
            const base = shownQuestions;
            setTimeout(() => {
              moveToNextQuestion(base);
              setAnswerState('idle');
            }, 180);
          } else {
            setAnswerState('wrong');
            endRound('答错了，本局结束', { expected: pendingQ.answer, input: raw, question: pendingQ.text });
          }
        }

        function handleKeypadPress(key) {
          if (!running || !started || !pendingQ) return;
          setAnswerState('idle');
          if (key === '⌫') {
            setInputValue((prev) => prev.slice(0, -1));
            return;
          }
          if (key === 10) {
            setInputValue('10');
            return;
          }
          const digit = String(key);
          setInputValue((prev) => (prev === '10' ? digit : `${prev}${digit}`.slice(0, 2)));
        }

        function restartCurrentMode() {
          const bestVal = Number(localStorage.getItem(bestKey) || 0);
          setBest(bestVal);
          setShowPrepare(true);
          setRunning(false);
          setStarted(false);
          setTimeLeft(difficulty.view.durationSec || 0);
          setStreak(0);
          streakRef.current = 0;
          const first = generateNBackQuestion(1, difficulty.view.maxResult);
          setCurrentQ(first);
          setShownQuestions([first]);
          setPendingQ(null);
          setInputValue('');
          setLastError(null);
          setShowRoundResult(false);
          setResultReason('');
          setAnswerState('idle');
        }

        return (
          <div className="page training-page">
            <div className="training-nav">
              <button className="back" onClick={onBack}>← 返回</button>
              <div className="training-info">
                <h3>{difficulty.name} · {currentTraining.label}</h3>
                <p>{kBack}-back：回答 {kBack === 1 ? '上一题' : '前两题'} 的答案</p>
              </div>
              <div className="dots"><div className="dot active" /></div>
            </div>

            <div className="training-main" style={{ gridTemplateColumns: '1fr' }}>
              <div className="grid-wrap">
                <div className="nback-shell">
                  <div className="nback-stats">
                    <div>{isTimed ? <>剩余 <b>{timeLeft}</b>s</> : <>模式 <b>∞</b></>}</div>
                    <div>连对 <b>{streak}</b></div>
                    <div>最佳 <b>{best}</b></div>
                  </div>
                  <div className="nback-equation">{currentQ ? currentQ.text : '?'}</div>
                  <div className="nback-keypad">
                    {keypadKeys.map((key) => (
                      <button key={String(key)} className="nback-key" onClick={() => handleKeypadPress(key)} disabled={!running || !started || !pendingQ}>{key}</button>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            {showPrepare && (
              <div className="overlay" onClick={() => setShowPrepare(false)}>
                <div className="modal" onClick={(e) => e.stopPropagation()}>
                  <div className="play">▶</div>
                  <h2>准备好了吗？</h2>
                  <p>
                    规则：屏幕显示当前题，回答<b>{kBack === 1 ? '上一题' : '前两题'}</b>的答案。

                    {isTimed ? '计时挑战在60秒内尽量多答。' : '无计时，直到答错结束。'}
                  </p>
                  <div className="tip">输入后自动结算；正确会自动跳到下一题</div>
                  <button className="next-btn" onClick={() => setShowPrepare(false)}>进入训练</button>
                </div>
              </div>
            )}

            {showRoundResult && (
              <div className="overlay">
                <div className="modal">
                  <h2 style={{ marginTop: 0 }}>Game Over</h2>
                  <p>{resultReason}</p>
                  <p>本次得分：<span className="highlight">{streak}</span></p>
                  {lastError && <p>复盘：{lastError.question}，正确答案 {lastError.expected}，你的输入 {lastError.input}</p>}
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '14px', marginTop: '16px' }}>
                    <button className="next-btn" style={{ marginTop: 0 }} onClick={restartCurrentMode}>再来一次</button>
                    <button className="next-btn" style={{ marginTop: 0 }} onClick={onComplete}>返回模式选择</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      function SequenceMemoryTrainingPage({ difficulty, onBack, onComplete }) {
        const [index, setIndex] = useState(0);
        const [showPrepare, setShowPrepare] = useState(true);
        const [phase, setPhase] = useState('show');
        const [sequence, setSequence] = useState([]);
        const [displayIndex, setDisplayIndex] = useState(0);
        const [answers, setAnswers] = useState([]);
        const [wrongSet, setWrongSet] = useState(new Set());
        const [submittedOnce, setSubmittedOnce] = useState(false);
        const [readyToCheck, setReadyToCheck] = useState(false);
        const [distractors, setDistractors] = useState([]);
        const [distractorIndex, setDistractorIndex] = useState(0);
        const inputRefs = useRef([]);

        const currentTraining = difficulty.trainings[index];
        const displayLength = currentTraining.variant === 'running-span' ? currentTraining.streamLength : currentTraining.length;
        const answerLength = currentTraining.variant === 'running-span' ? currentTraining.recallLength : currentTraining.length;
        const [optionPool, setOptionPool] = useState([]);
        const expected = currentTraining.variant === 'running-span'
          ? sequence.slice(Math.max(0, sequence.length - answerLength))
          : currentTraining.variant === 'rule-switch'
          ? transformSequenceForRule(sequence, currentTraining.transform)
          : currentTraining.variant === 'chunk-reconstruct'
            ? sequence
            : currentTraining.order === 'reverse'
              ? [...sequence].reverse()
              : sequence;

        function nextTraining() {
          if (index < difficulty.trainings.length - 1) {
            setIndex((i) => i + 1);
          } else {
            onComplete();
          }
        }

        useEffect(() => {
          const chars = createSequenceMemoryChars(currentTraining.contentType, displayLength);
          setSequence(chars);
          setDisplayIndex(0);
          setAnswers(Array.from({ length: answerLength }, () => ''));
          setWrongSet(new Set());
          setSubmittedOnce(false);
          setReadyToCheck(false);
          setDistractors([]);
          setDistractorIndex(0);
          setOptionPool([]);
          inputRefs.current = [];
          setShowPrepare(true);
          setPhase('show');
        }, [index, difficulty, displayLength, answerLength]);

        useEffect(() => {
          if (!showPrepare && phase === 'show') {
            const timer = setInterval(() => {
              setDisplayIndex((prev) => {
                if (prev >= sequence.length - 1) {
                  clearInterval(timer);
                  if (currentTraining.variant === 'dual-task') {
                    setDistractors(createDualTaskPrompts(sequence, currentTraining.distractorCount));
                    setPhase('distractor');
                  } else {
                    setPhase('input');
                  }
                  return prev;
                }
                return prev + 1;
              });
            }, 1000);
            return () => clearInterval(timer);
          }
        }, [showPrepare, phase, sequence.length, currentTraining]);
        useEffect(() => {
          if (showPrepare || phase !== 'input') return;
          setTimeout(() => inputRefs.current[0]?.focus(), 0);
        }, [showPrepare, phase, index]);

        useEffect(() => {
          if (showPrepare || phase !== 'input') return;
          if (currentTraining.variant !== 'chunk-reconstruct') return;
          if (optionPool.length) return;
          setOptionPool(createChunkOptionPool(expected, currentTraining.distractorCount));
        }, [showPrepare, phase, currentTraining, expected, optionPool.length]);

        useEffect(() => {
          if (showPrepare || phase !== 'input') return;
          if (!readyToCheck) return;
          if (answers.some((a) => normalizeSequenceValue(a) === '')) return;
          const normalized = answers.map(normalizeSequenceValue);
          const normalizedExpected = expected.map(normalizeSequenceValue);
          const wrong = new Set();
          normalized.forEach((v, i) => {
            if (v !== normalizedExpected[i]) wrong.add(i);
          });
          setSubmittedOnce(true);
          setWrongSet(wrong);
          if (wrong.size === 0) {
            setTimeout(nextTraining, 350);
          }
          setReadyToCheck(false);
        }, [answers, phase, showPrepare, expected, readyToCheck]);

        function updateAnswerAt(pos, rawVal) {
          const next = [...answers];
          next[pos] = (rawVal || '').slice(-1);
          setAnswers(next);
          if (wrongSet.size) setWrongSet(new Set());
          if (next.every((x) => normalizeSequenceValue(x) !== '')) {
            setReadyToCheck(true);
          }
        }

        function handleChunkPick(char) {
          const emptyIndex = answers.findIndex((v) => normalizeSequenceValue(v) === '');
          if (emptyIndex === -1) return;
          updateAnswerAt(emptyIndex, char);
        }

        function answerDistractor(choice) {
          if (!distractors.length) {
            setPhase('input');
            return;
          }
          setDistractorIndex((prev) => {
            const next = prev + 1;
            if (next >= distractors.length) {
              setPhase('input');
              return prev;
            }
            return next;
          });
        }

        return (
          <div className="page training-page">
            <div className="training-nav">
              <button className="back" onClick={onBack}>← 返回</button>
              <div className="training-info">
                <h3>{difficulty.name} · {currentTraining.label}</h3>
                <p>{formatSequenceTrainingDesc(currentTraining)}</p>
              </div>
              <div className="dots">
                {difficulty.trainings.map((_, i) => <div key={i} className={`dot ${i < index ? 'done' : ''} ${i === index ? 'active' : ''}`} />)}
              </div>
            </div>

            <div className="training-main" style={{ gridTemplateColumns: '1fr' }}>
              <div className="grid-wrap">
                <div className="seq-stage">
                  {!showPrepare && phase === 'show' && <div className="seq-char">{sequence[displayIndex]}</div>}
                  {!showPrepare && phase === 'input' && <div className="seq-char" style={{ color: '#666', fontSize: 'clamp(20px, 3vw, 30px)' }}>请输入答案</div>}
                </div>
              </div>
            </div>

            {showPrepare && (
              <div className="overlay" onClick={() => setShowPrepare(false)}>
                <div className="modal" onClick={(e) => e.stopPropagation()}>
                  <div className="play">▶</div>
                  <h2>准备好了吗？</h2>
                  <p>屏幕中央将每秒展示一个字符。{formatSequencePrepareDesc(currentTraining)}</p>
                  <div className="tip">点击任意键继续 / 点击下方按钮继续</div>
                  <button className="next-btn" onClick={() => setShowPrepare(false)}>开始展示</button>
                </div>
              </div>
            )}

            {!showPrepare && phase === 'input' && (
              <div className="overlay">
                <div className="modal" onClick={(e) => e.stopPropagation()}>
                  <h2 style={{ marginTop: 0 }}>{formatSequenceInputTitle(currentTraining)}</h2>
                  <div className="seq-input-grid" style={{ gridTemplateColumns: `repeat(${answerLength}, 1fr)` }}>
                    {currentTraining.variant === 'chunk-reconstruct' ? (
                      answers.map((val, i) => (
                        <div key={i} className={`seq-slot ${wrongSet.has(i) ? 'wrong' : ''}`}>{val || '＿'}</div>
                      ))
                    ) : (
                      answers.map((val, i) => (
                        <input
                          key={i}
                          ref={(el) => (inputRefs.current[i] = el)}
                          className={`seq-input ${wrongSet.has(i) ? 'wrong' : ''}`}
                          maxLength={1}
                          value={val}
                          onChange={(e) => {
                            const nextVal = e.target.value.slice(-1);
                            updateAnswerAt(i, nextVal);
                            if (nextVal && i < answerLength - 1) {
                              inputRefs.current[i + 1]?.focus();
                            }
                          }}
                          onKeyDown={(e) => {
                            if (e.key === 'Backspace' && !answers[i] && i > 0) {
                              inputRefs.current[i - 1]?.focus();
                            }
                          }}
                        />
                      ))
                    )}
                  </div>
                  {currentTraining.variant === 'chunk-reconstruct' && (
                    <div className="seq-option-grid">
                      {optionPool.map((char, i) => (
                        <button key={`${char}-${i}`} className="seq-option" onClick={() => handleChunkPick(char)}>{char}</button>
                      ))}
                    </div>
                  )}
                  <div className="tip">{formatSequenceTip(currentTraining)}</div>
                  {submittedOnce && <div className="seq-answer">正确答案：{expected.join(' ')}</div>}
                  <div style={{ display: 'flex', gap: '10px', marginTop: '12px' }}>
                    <button className="next-btn" style={{ marginTop: 0, opacity: submittedOnce ? 1 : 0.45 }} disabled={!submittedOnce} onClick={nextTraining}>查看答案并进入下一题</button>
                  </div>
                </div>
              </div>
            )}

            {!showPrepare && phase === 'distractor' && (
              <div className="overlay">
                <div className="modal" onClick={(e) => e.stopPropagation()}>
                  <h2 style={{ marginTop: 0 }}>干扰题 {Math.min(distractorIndex + 1, distractors.length)}/{distractors.length}</h2>
                  <p>{distractors[distractorIndex]?.text}</p>
                  <div style={{ display: 'flex', gap: '10px', marginTop: '14px' }}>
                    <button className="next-btn" style={{ marginTop: 0 }} onClick={() => answerDistractor(true)}>是</button>
                    <button className="next-btn" style={{ marginTop: 0 }} onClick={() => answerDistractor(false)}>否</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      function App() {
        const [currentPage, setCurrentPage] = useState('home');
        const [selectedProject, setSelectedProject] = useState(null);
        const [selectedDifficulty, setSelectedDifficulty] = useState(null);

        if (currentPage === 'home') return <HomePage onSelectTraining={() => setCurrentPage('project')} />;

        if (currentPage === 'project') {
          return (
            <ProjectPage
              onBack={() => setCurrentPage('home')}
              onSelectProject={(project) => {
                if (project.status !== 'available') return;
                setSelectedProject(project.id);
                setCurrentPage('difficulty');
              }}
            />
          );
        }

        if (currentPage === 'difficulty') {
          const module = trainingModules[selectedProject];
          return (
            <DifficultyPage
              module={module}
              onSelectDifficulty={(d) => {
                setSelectedDifficulty(d);
                setCurrentPage('training');
              }}
              onBack={() => setCurrentPage('project')}
            />
          );
        }

        return (
          <>
            {selectedProject === 'stroop' ? (
              <StroopTrainingPage
                difficulty={selectedDifficulty}
                onBack={() => setCurrentPage('difficulty')}
                onComplete={() => setCurrentPage('difficulty')}
              />
            ) : selectedProject === 'nback-math' ? (
              <NBackMathTrainingPage
                difficulty={selectedDifficulty}
                onBack={() => setCurrentPage('difficulty')}
                onComplete={() => setCurrentPage('difficulty')}
              />
            ) : selectedProject === 'seq-memory' ? (
              <SequenceMemoryTrainingPage
                difficulty={selectedDifficulty}
                onBack={() => setCurrentPage('difficulty')}
                onComplete={() => setCurrentPage('difficulty')}
              />
            ) : (
              <TrainingPage
                difficulty={selectedDifficulty}
                onBack={() => setCurrentPage('difficulty')}
                onComplete={() => setCurrentPage('difficulty')}
              />
            )}
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
