<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>加减法 · 1-back 算术</title>
    <style>
      :root {
        --bg: #111318;
        --panel: #191d26;
        --panel-2: #1f2430;
        --text: #f5f7ff;
        --muted: #9aa3b2;
        --accent: #ffd84d;
        --ok: #23c16b;
        --bad: #ef4444;
        --line: #2f3747;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: radial-gradient(circle at 20% -10%, #2a3040 0, var(--bg) 45%);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .app {
        min-height: 100%;
        display: grid;
        grid-template-rows: 1fr 1fr;
      }

      .top, .bottom {
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .top {
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #1a1f2b 0%, #131824 100%);
      }

      .q-wrap { text-align: center; max-width: 900px; width: 100%; }
      .meta {
        display: flex;
        justify-content: center;
        gap: 18px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 14px;
      }

      .question {
        font-size: clamp(56px, 12vw, 120px);
        font-weight: 900;
        letter-spacing: 0.05em;
        margin: 10px 0;
      }

      .hint {
        margin-top: 12px;
        color: var(--muted);
        font-size: clamp(14px, 2.2vw, 18px);
      }

      .bottom { background: var(--panel); }

      .input-card {
        width: min(760px, 100%);
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px;
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
      }

      .sub-hint {
        text-align: center;
        color: var(--muted);
        margin: 0 0 10px;
        font-size: 14px;
      }

      .answer {
        width: min(260px, 70vw);
        height: 56px;
        border-radius: 12px;
        border: 2px solid #4a566f;
        background: #0f131c;
        color: var(--text);
        text-align: center;
        font-size: 28px;
        font-weight: 700;
        outline: none;
      }

      .answer:disabled { opacity: 0.55; cursor: not-allowed; }
      .answer.flash-ok { border-color: var(--ok); box-shadow: 0 0 0 3px rgba(35,193,107,0.15); }
      .answer.flash-bad { border-color: var(--bad); animation: shake 0.2s linear; }

      @keyframes shake {
        25% { transform: translateX(-3px); }
        75% { transform: translateX(3px); }
      }

      .btn {
        height: 56px;
        padding: 0 16px;
        border-radius: 12px;
        border: 1px solid #4b556a;
        background: #2d3748;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }

      .btn.primary {
        border: 0;
        background: var(--accent);
        color: #222;
      }

      .btn:disabled { opacity: 0.55; cursor: not-allowed; }

      .status {
        margin-top: 10px;
        text-align: center;
        color: var(--muted);
        min-height: 20px;
      }

      .game-over {
        margin-top: 14px;
        border-top: 1px dashed #4b556a;
        padding-top: 12px;
      }

      .game-over h3 { margin: 0 0 6px; }
      .game-over p { margin: 6px 0; color: #d1d7e2; }

      .review {
        margin-top: 10px;
        background: #121722;
        border: 1px solid #313c4f;
        border-radius: 10px;
        padding: 8px 10px;
      }

      .review li {
        margin: 6px 0;
        color: #c7d0df;
        font-size: 14px;
      }

      .tag { color: var(--accent); font-weight: 700; }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="top">
        <div class="q-wrap">
          <div class="meta" id="meta"></div>
          <div class="question" id="question">-</div>
          <div class="hint" id="hint"></div>
        </div>
      </section>

      <section class="bottom">
        <div class="input-card">
          <p class="sub-hint" id="subHint"></p>
          <div class="row">
            <input id="answerInput" class="answer" inputmode="numeric" autocomplete="off" />
            <button id="submitBtn" class="btn primary">提交</button>
            <button id="pauseBtn" class="btn">暂停</button>
          </div>
          <div class="status" id="status"></div>
          <div id="gameOverBox"></div>
        </div>
      </section>
    </main>

    <script>
      // ========================
      // config
      // ========================
      const CONFIG = {
        operandMin: 0,
        operandMax: 10,
        restrictResultToRange: true, // 默认 A) 结果限制 0..10
        allowNegativeInput: false,
        plusRatio: 0.5,
      };

      // ========================
      // storage（best 读写）
      // ========================
      const BEST_KEY = 'math_1back_best';
      const storage = {
        loadBest() {
          const n = Number(localStorage.getItem(BEST_KEY));
          return Number.isFinite(n) && n >= 0 ? n : 0;
        },
        saveBest(best) {
          localStorage.setItem(BEST_KEY, String(best));
        },
      };

      // ========================
      // generator（出题）
      // ========================
      let questionSeqId = 1;

      function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function genAddition() {
        const a = randInt(CONFIG.operandMin, CONFIG.operandMax);
        const maxB = CONFIG.restrictResultToRange ? CONFIG.operandMax - a : CONFIG.operandMax;
        const b = randInt(CONFIG.operandMin, Math.max(CONFIG.operandMin, maxB));
        return { a, b, op: '+', answer: a + b };
      }

      function genSubtraction() {
        if (CONFIG.restrictResultToRange) {
          const b = randInt(CONFIG.operandMin, CONFIG.operandMax);
          const a = randInt(b, CONFIG.operandMax); // 保证 a-b>=0
          return { a, b, op: '-', answer: a - b };
        }
        const a = randInt(CONFIG.operandMin, CONFIG.operandMax);
        const b = randInt(CONFIG.operandMin, CONFIG.operandMax);
        return { a, b, op: '-', answer: a - b };
      }

      function genQuestion() {
        const usePlus = Math.random() < CONFIG.plusRatio;
        const base = usePlus ? genAddition() : genSubtraction();
        return {
          id: questionSeqId++,
          a: base.a,
          b: base.b,
          op: base.op,
          text: `${base.a} ${base.op === '-' ? '−' : '+'} ${base.b} = ?`,
          answer: base.answer,
        };
      }

      // ========================
      // state（状态机）
      // ========================
      const state = {
        running: false,
        paused: false,
        currentQ: null,
        pendingQ: null,
        qIndex: 0,
        streak: 0,
        best: storage.loadBest(),
        history: [],
      };

      function startGame() {
        state.running = true;
        state.paused = false;
        state.streak = 0;
        state.qIndex = 1;
        state.currentQ = genQuestion();
        state.pendingQ = null;
        state.history = [];
        render();
      }

      // 答对后推进：pendingQ 永远指向“上一题”
      function nextTurn() {
        state.qIndex += 1;
        state.pendingQ = state.currentQ;
        state.currentQ = genQuestion();
        render();
        focusInputIfEnabled();
      }

      function toIntOrNull(v) {
        const raw = String(v).trim();
        if (!raw) return null;
        if (!/^[-]?\d+$/.test(raw)) return null;
        const num = Number(raw);
        return Number.isInteger(num) ? num : null;
      }

      function updateBestIfNeeded() {
        if (state.streak > state.best) {
          state.best = state.streak;
          storage.saveBest(state.best);
        }
      }

      function gameOver(userInputRaw) {
        updateBestIfNeeded();
        state.running = false;
        state.paused = false;
        ui.status.textContent = '你答错了，游戏结束。';
        flashBad();
        renderGameOver(userInputRaw);
        renderMeta();
      }

      function submitAnswer() {
        if (!state.running || state.paused) return;

        if (!state.pendingQ) {
          ui.status.textContent = '还没有要回答的题（第 2 题开始作答）。';
          return;
        }

        const raw = ui.answerInput.value;
        const parsed = toIntOrNull(raw);
        if (parsed === null) {
          ui.status.textContent = '请输入整数。';
          flashBad();
          return;
        }

        const correct = parsed === state.pendingQ.answer;
        state.history.push({
          qShown: state.currentQ,
          pending: state.pendingQ,
          userInput: raw,
          correct,
        });

        if (!correct) {
          gameOver(raw);
          return;
        }

        state.streak += 1;
        ui.status.textContent = '正确';
        playSfx('correct');
        flashOk(() => {
          ui.answerInput.value = '';
          nextTurn();
          ui.status.textContent = '';
        });
      }

      // ========================
      // ui/render
      // ========================
      const ui = {
        meta: document.getElementById('meta'),
        question: document.getElementById('question'),
        hint: document.getElementById('hint'),
        subHint: document.getElementById('subHint'),
        answerInput: document.getElementById('answerInput'),
        submitBtn: document.getElementById('submitBtn'),
        pauseBtn: document.getElementById('pauseBtn'),
        status: document.getElementById('status'),
        gameOverBox: document.getElementById('gameOverBox'),
      };

      function renderMeta() {
        ui.meta.innerHTML = `
          <span>题号：<span class="tag">${state.qIndex || 0}</span></span>
          <span>连续正确：<span class="tag">${state.streak}</span></span>
          <span>最高纪录：<span class="tag">${state.best}</span></span>
        `;
      }

      function renderQuestion() {
        ui.question.textContent = state.currentQ ? state.currentQ.text : '-';
      }

      function renderInputArea() {
        const noPending = !state.pendingQ;
        const disabled = noPending || !state.running || state.paused;
        ui.answerInput.disabled = disabled;
        ui.submitBtn.disabled = disabled;

        if (!state.running) {
          ui.subHint.textContent = '本局结束，点击“再来一局”开始新的挑战。';
        } else if (state.paused) {
          ui.subHint.textContent = '已暂停';
        } else if (noPending) {
          ui.subHint.textContent = '先看题，下一题开始输入上一题答案';
        } else {
          ui.subHint.textContent = `回答上一题（第 ${state.qIndex - 1} 题）的答案`;
        }
      }

      function renderHint() {
        if (!state.running) {
          ui.hint.textContent = '规则：你永远回答上一题的答案。';
          return;
        }
        if (!state.pendingQ) {
          ui.hint.textContent = '第 1 题仅展示，不作答。';
        } else {
          ui.hint.textContent = '当前看到的是新题，你输入的是上一题答案。';
        }
      }

      function renderPauseButton() {
        ui.pauseBtn.textContent = state.paused ? '继续' : '暂停';
        ui.pauseBtn.disabled = !state.running;
      }

      function renderGameOver(userInputRaw = null) {
        if (state.running) {
          ui.gameOverBox.innerHTML = '';
          return;
        }

        const recent = state.history.slice(-5).reverse();
        const failed = state.history[state.history.length - 1];
        const pending = failed?.pending;

        ui.gameOverBox.innerHTML = `
          <div class="game-over">
            <h3>Game Over</h3>
            <p>你输入：<span class="tag">${escapeHtml(String(userInputRaw ?? ''))}</span></p>
            <p>正确答案：<span class="tag">${pending ? pending.answer : '-'}</span></p>
            <p>本次连续正确：<span class="tag">${state.streak}</span> ｜ 历史最高：<span class="tag">${state.best}</span></p>
            <button id="restartBtn" class="btn primary">再来一局</button>
            <div class="review">
              <strong>最近 5 条记录</strong>
              <ul>
                ${recent.map((item) => `
                  <li>
                    回答题：${item.pending ? item.pending.text : '无'}；
                    正确：${item.pending ? item.pending.answer : '-'}；
                    输入：${escapeHtml(String(item.userInput))}；
                    结果：${item.correct ? '✅' : '❌'}
                  </li>
                `).join('') || '<li>暂无</li>'}
              </ul>
            </div>
          </div>
        `;

        const restartBtn = document.getElementById('restartBtn');
        if (restartBtn) restartBtn.onclick = startGame;
      }

      function render() {
        renderMeta();
        renderQuestion();
        renderHint();
        renderInputArea();
        renderPauseButton();
        renderGameOver();
      }

      function focusInputIfEnabled() {
        if (!ui.answerInput.disabled) ui.answerInput.focus();
      }

      function flashOk(done) {
        ui.answerInput.classList.add('flash-ok');
        setTimeout(() => {
          ui.answerInput.classList.remove('flash-ok');
          done?.();
        }, 100);
      }

      function flashBad() {
        ui.answerInput.classList.remove('flash-bad');
        void ui.answerInput.offsetWidth;
        ui.answerInput.classList.add('flash-bad');
      }

      function escapeHtml(s) {
        return s.replace(/[&<>'"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[ch]));
      }

      // ========================
      // handlers（输入与提交）
      // ========================
      function sanitizeInput(raw) {
        let s = raw.replace(/\s+/g, '');
        s = s.replace(/[^0-9-]/g, '');
        if (!CONFIG.allowNegativeInput) s = s.replace(/-/g, '');
        else s = s.replace(/(?!^)-/g, '');
        return s;
      }

      ui.answerInput.addEventListener('input', (e) => {
        const clean = sanitizeInput(e.target.value);
        if (clean !== e.target.value) e.target.value = clean;
      });

      ui.submitBtn.addEventListener('click', submitAnswer);
      ui.answerInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submitAnswer();
      });

      ui.pauseBtn.addEventListener('click', () => {
        if (!state.running) return;
        state.paused = !state.paused;
        ui.status.textContent = state.paused ? '已暂停' : '';
        render();
        focusInputIfEnabled();
      });

      // 题目推进由“答对后”触发；没有 setInterval 自动刷题
      // 音效 hook：后续可接入真实音频
      function playSfx(type) {
        void type;
      }

      // init
      startGame();
      render();
    </script>
  </body>
</html>
