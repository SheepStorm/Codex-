<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>序列工作记忆（进阶）</title>
    <style>
      :root {
        --bg: #1d1d1d;
        --accent: #fef500;
        --text-main: #fff;
        --text-sub: #888;
        --ok: #00c853;
        --bad: #e92222;
        --card: #232323;
        --stroke: #3a3a3a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .page { min-height: 100vh; padding: 18px; }
      .header {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 14px;
        align-items: center;
        margin-bottom: 14px;
      }
      .title { margin: 0; font-size: clamp(26px, 4.8vw, 44px); font-weight: 900; }
      .desc { margin: 4px 0 0; color: var(--text-sub); }
      .tabs { display: flex; gap: 10px; }
      .tab {
        border: 1px solid #444;
        background: #252525;
        color: #ddd;
        border-radius: 999px;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: 700;
      }
      .tab.active { background: var(--accent); color: #111; border-color: transparent; }

      .stage {
        min-height: 58vh;
        border: 1px solid #2a1320;
        border-radius: 16px;
        background: linear-gradient(180deg, #16000f, #0e000a);
        position: relative;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .stage::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      .big-seq {
        position: relative;
        z-index: 1;
        font-size: clamp(84px, 14vw, 190px);
        font-weight: 900;
        text-shadow: 0 8px 0 rgba(0,0,0,0.4);
      }

      .panel {
        margin-top: 14px;
        border: 1px solid var(--stroke);
        border-radius: 14px;
        background: var(--card);
        padding: 14px;
      }
      .panel p { margin: 0 0 10px; line-height: 1.6; color: #ddd; }
      .hl { color: var(--accent); font-weight: 800; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

      .slot, .phase2-ghost {
        width: 52px;
        height: 56px;
        border-radius: 10px;
        border: 2px solid #555;
        background: #111;
        color: #fff;
        text-align: center;
        font-size: 26px;
        font-weight: 900;
      }
      .slot.ok { border-color: var(--ok); }
      .slot.bad { border-color: var(--bad); animation: shake 0.22s ease; }
      .slot.submitted {
        color: transparent;
        caret-color: transparent;
        user-select: none;
      }
      .slot.submitted::placeholder { color: transparent; }

      .phase2-wrap { margin-top: 10px; }
      .phase2-ghost { width: 48px; height: 48px; border: 1px solid #444; background: #191919; }
      .phase2-input {
        width: 78px;
        height: 78px;
        border-radius: 12px;
        border: 2px solid #666;
        background: #111;
        color: #fff;
        text-align: center;
        font-size: 36px;
        font-weight: 900;
      }
      .phase2-input.ok { border-color: var(--ok); }
      .phase2-input.bad { border-color: var(--bad); animation: shake 0.22s ease; }

      .btn {
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #111;
        font-weight: 800;
        padding: 10px 14px;
        cursor: pointer;
      }
      .btn.ghost {
        background: transparent;
        border: 1px solid #555;
        color: #eee;
      }

      .emoji-btn {
        width: 64px;
        height: 64px;
        border-radius: 12px;
        border: 1px solid #555;
        background: #151515;
        color: #fff;
        font-size: 30px;
        cursor: pointer;
      }

      .stats { margin-top: 10px; color: var(--text-sub); font-size: 14px; }
      .solution {
        margin-top: 12px;
        border-top: 1px dashed #555;
        padding-top: 10px;
        color: #ddd;
      }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-3px); }
        75% { transform: translateX(3px); }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="header">
        <div>
          <h1 class="title">序列工作记忆（进阶）</h1>
          <p class="desc">两阶段：先复述完整序列，再回答原序列第 n 位（已做防作弊隐藏）</p>
        </div>
        <div class="tabs" id="tabs"></div>
      </div>

      <div class="stage" id="stage"><div class="big-seq" id="stageChar">•</div></div>
      <div class="panel" id="panel"></div>
    </div>

    <script>
      // ========================
      // questionGenerator.js
      // ========================
      const POOLS = {
        digits: '0123456789'.split(''),
        letters: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),
        emoji: ['🏎️','🌍','☕','🌸','📎','🎈','🎯','🎵','🧩','🚀'],
      };

      const TRAININGS_BY_TYPE = {
        digits: { type: 'digits', mode: 'random', length: 5, questions: 10, answerType: 'input' },
        letters: { type: 'letters', mode: 'random', length: 5, questions: 10, answerType: 'input' },
        emoji: { type: 'emoji', mode: 'random', length: 5, questions: 10, answerType: 'emoji' },
      };

      const shuffle = (arr) => {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };

      function buildQuestion(training, idx) {
        const mode = training.mode === 'random' ? (Math.random() > 0.5 ? 'forward' : 'backward') : training.mode;
        let originalSeq = [];
        if (training.type === 'digits') {
          originalSeq = Array.from({ length: training.length }, () => POOLS.digits[Math.floor(Math.random() * POOLS.digits.length)]);
        } else if (training.type === 'letters') {
          originalSeq = Array.from({ length: training.length }, () => POOLS.letters[Math.floor(Math.random() * POOLS.letters.length)]);
        } else {
          originalSeq = shuffle(POOLS.emoji).slice(0, training.length);
        }

        const n = Math.floor(Math.random() * training.length) + 1;
        const answerSeqPhase1 = mode === 'backward' ? [...originalSeq].reverse() : [...originalSeq];
        return {
          id: `${training.type}-${idx}-${Date.now()}`,
          type: training.type,
          mode,
          originalSeq,
          n,
          answerSeqPhase1,
          answerPhase2: originalSeq[n - 1],
        };
      }

      // ========================
      // stateMachine.js
      // ========================
      const state = {
        trainingType: 'digits',
        currentTraining: TRAININGS_BY_TYPE.digits,
        currentQuestionIndex: 0,
        currentQuestion: null,
        phase: 'showing', // showing | phase1 | phase1_feedback | phase2 | phase2_feedback
        userAnswerPhase1: [],
        userAnswerPhase2: '',
        attemptsPhase1: 0,
        attemptsPhase2: 0,
        phase1Feedback: [],
        phase2Feedback: null,
        showSolution: false,
        stats: {
          total: 0,
          correct: 0,
          streak: 0,
          perTypeCorrectCount: { digits: 0, letters: 0, emoji: 0 },
          perTypeTotalCount: { digits: 0, letters: 0, emoji: 0 },
        },
        showIndex: -1,
        showingTimer: null,
      };

      function resetQuestion() {
        state.currentQuestion = buildQuestion(state.currentTraining, state.currentQuestionIndex);
        state.phase = 'showing';
        state.userAnswerPhase1 = [];
        state.userAnswerPhase2 = '';
        state.attemptsPhase1 = 0;
        state.attemptsPhase2 = 0;
        state.phase1Feedback = Array(state.currentQuestion.answerSeqPhase1.length).fill(null);
        state.phase2Feedback = null;
        state.showSolution = false;
        state.showIndex = 0;
      }

      function nextQuestion() {
        state.currentQuestionIndex += 1;
        if (state.currentQuestionIndex >= state.currentTraining.questions) {
          state.currentQuestionIndex = 0;
        }
        resetQuestion();
        runShowing();
        render();
      }

      // ========================
      // validators
      // ========================
      const normalize = (v) => String(v || '').trim().toUpperCase();

      function validatePhase1() {
        const target = state.currentQuestion.answerSeqPhase1.map(normalize);
        const input = state.userAnswerPhase1.map(normalize);
        state.phase1Feedback = target.map((t, i) => (input[i] ? (input[i] === t ? 'ok' : 'bad') : null));
        const allCorrect = target.every((t, i) => input[i] === t);
        return allCorrect;
      }

      function validatePhase2() {
        return normalize(state.userAnswerPhase2) === normalize(state.currentQuestion.answerPhase2);
      }

      // ========================
      // ui helpers（防作弊重点）
      // ========================
      function hidePhase1InputForAntiCheat() {
        // 方案1：把明文从 input value 清空，仅把答案保留在 JS 内存 state.userAnswerPhase1
        // 这样进入 Phase2 后页面上看不到可“数第n位”的字符，避免视觉检索作弊。
        const inputs = document.querySelectorAll('.phase1-input');
        inputs.forEach((el) => {
          el.value = '';
          el.classList.add('submitted');
          el.disabled = true;
          el.setAttribute('readonly', 'readonly');
          el.setAttribute('aria-hidden', 'true');
        });
      }

      // ========================
      // renderers
      // ========================
      const tabsEl = document.getElementById('tabs');
      const stageCharEl = document.getElementById('stageChar');
      const panelEl = document.getElementById('panel');

      function renderTabs() {
        const tabs = [
          ['digits', 'Digits'],
          ['letters', 'Letters'],
          ['emoji', 'Emoji'],
        ];
        tabsEl.innerHTML = tabs
          .map(([key, label]) => `<button class="tab ${state.trainingType === key ? 'active' : ''}" data-tab="${key}">${label}</button>`)
          .join('');

        tabsEl.querySelectorAll('.tab').forEach((btn) => {
          btn.onclick = () => {
            state.trainingType = btn.dataset.tab;
            state.currentTraining = TRAININGS_BY_TYPE[state.trainingType];
            state.currentQuestionIndex = 0;
            resetQuestion();
            runShowing();
            render();
          };
        });
      }

      function renderStage() {
        const q = state.currentQuestion;
        if (state.phase === 'showing' && state.showIndex >= 0) {
          stageCharEl.textContent = q.originalSeq[state.showIndex] || '•';
        } else {
          stageCharEl.textContent = '•';
        }
      }

      function phase1InputHTML() {
        const q = state.currentQuestion;
        return `
          <div class="row">
            ${Array.from({ length: q.answerSeqPhase1.length }).map((_, i) => {
              const fb = state.phase1Feedback[i];
              const klass = fb ? fb : '';
              const val = state.userAnswerPhase1[i] || '';
              return `<input class="slot phase1-input ${klass}" data-i="${i}" maxlength="1" value="${val}">`;
            }).join('')}
          </div>
        `;
      }

      function phase1EmojiHTML() {
        const q = state.currentQuestion;
        const options = shuffle([...new Set(q.originalSeq)]);
        return `
          <div class="row">
            ${Array.from({ length: q.answerSeqPhase1.length }).map((_, i) => {
              const fb = state.phase1Feedback[i];
              return `<div class="slot ${fb || ''}" style="display:grid;place-items:center;">${state.userAnswerPhase1[i] || ''}</div>`;
            }).join('')}
          </div>
          <div class="row" style="margin-top:8px;">
            ${options.map((e) => `<button class="emoji-btn" data-emoji="${e}">${e}</button>`).join('')}
          </div>
          <div class="row" style="margin-top:8px;"><button class="btn ghost" id="undoEmoji">撤销</button></div>
        `;
      }

      function phase2AreaHTML() {
        const q = state.currentQuestion;
        const nIdx = q.n - 1;
        const modeWord = q.mode === 'backward' ? '逆序' : '顺序';

        if (q.type !== 'emoji') {
          return `
            <p>请输入<span class="hl">原序列第 ${q.n} 位</span>（这里的 n 指原始展示序列）</p>
            <p style="color:#aaa">当前规则：<span class="hl">${modeWord}</span>复述 + 指定位作答</p>
            <div class="phase2-wrap row">
              ${Array.from({ length: q.originalSeq.length }).map((_, i) =>
                i === nIdx
                  ? `<input id="phase2Input" class="phase2-input ${state.phase2Feedback || ''}" maxlength="1" value="${state.userAnswerPhase2 || ''}">`
                  : `<div class="phase2-ghost"></div>`
              ).join('')}
            </div>
          `;
        }

        const options = shuffle([...new Set(q.originalSeq)]);
        return `
          <p>请选择<span class="hl">原序列第 ${q.n} 位</span>（这里的 n 指原始展示序列）</p>
          <div class="row">
            ${options.map((e) => `<button class="emoji-btn" data-p2emoji="${e}">${e}</button>`).join('')}
          </div>
        `;
      }

      function renderPanel() {
        const q = state.currentQuestion;
        const modeText = q.mode === 'backward' ? '逆序' : '顺序';
        let html = `
          <p>请按 <span class="hl">${modeText}</span> 完成复述，然后回答 <span class="hl">原序列第 ${q.n} 位</span>。</p>
          <div class="stats">题型：${state.trainingType.toUpperCase()} ｜ 第 ${state.currentQuestionIndex + 1}/${state.currentTraining.questions} 题 ｜ 总正确 ${state.stats.correct}/${state.stats.total}</div>
        `;

        if (state.phase === 'showing') {
          html += `<p style="margin-top:10px">正在展示序列…</p>`;
        }

        if (state.phase === 'phase1' || state.phase === 'phase1_feedback') {
          html += `<h3 style="margin:10px 0 8px;">Phase 1 复述阶段</h3>`;
          html += q.type === 'emoji' ? phase1EmojiHTML() : phase1InputHTML();
          html += `
            <div class="row" style="margin-top:10px">
              <button class="btn" id="submitP1">提交Phase1</button>
              <button class="btn ghost" id="viewSolutionP1">查看正确答案</button>
              ${state.phase === 'phase1_feedback' ? '<button class="btn ghost" id="retryP1">再试一次</button><button class="btn" id="toP2">下一步（回答第n位）</button>' : ''}
            </div>
          `;
        }

        if (state.phase === 'phase2' || state.phase === 'phase2_feedback') {
          html += `<h3 style="margin:10px 0 8px;">Phase 2 定位阶段</h3>`;
          html += phase2AreaHTML();
          html += `
            <div class="row" style="margin-top:10px">
              <button class="btn" id="submitP2">提交Phase2</button>
              <button class="btn ghost" id="viewSolutionP2">查看正确答案</button>
              ${state.phase === 'phase2_feedback' ? '<button class="btn ghost" id="retryP2">再来一次</button><button class="btn" id="nextQ">下一题</button>' : ''}
            </div>
          `;
        }

        if (state.showSolution) {
          html += `
            <div class="solution">
              <div>原始序列：<span class="hl">${q.originalSeq.join(' ')}</span></div>
              <div>Phase1 正确复述：<span class="hl">${q.answerSeqPhase1.join(' ')}</span></div>
              <div>第 ${q.n} 位答案：<span class="hl">${q.answerPhase2}</span></div>
            </div>
          `;
        }

        panelEl.innerHTML = html;
        bindDynamicEvents();
      }

      function bindDynamicEvents() {
        // phase1 input bindings
        panelEl.querySelectorAll('.phase1-input').forEach((input, idx, arr) => {
          input.oninput = (e) => {
            const v = e.target.value.toUpperCase();
            state.userAnswerPhase1[idx] = v;
            if (v && idx < arr.length - 1) arr[idx + 1].focus();
          };
          input.onkeydown = (e) => {
            if (e.key === 'Backspace' && !state.userAnswerPhase1[idx] && idx > 0) arr[idx - 1].focus();
          };
          input.onpaste = (e) => {
            const txt = e.clipboardData.getData('text').toUpperCase().slice(0, arr.length);
            if (!txt) return;
            e.preventDefault();
            state.userAnswerPhase1 = Array(arr.length).fill('');
            txt.split('').forEach((c, i) => state.userAnswerPhase1[i] = c);
            render();
          };
        });

        panelEl.querySelectorAll('[data-emoji]').forEach((b) => b.onclick = () => {
          if (state.userAnswerPhase1.length < state.currentQuestion.answerSeqPhase1.length) {
            state.userAnswerPhase1.push(b.dataset.emoji);
            render();
          }
        });
        const undo = document.getElementById('undoEmoji');
        if (undo) undo.onclick = () => { state.userAnswerPhase1.pop(); render(); };

        const submitP1 = document.getElementById('submitP1');
        if (submitP1) submitP1.onclick = () => {
          state.attemptsPhase1 += 1;
          const ok = validatePhase1();
          state.phase = ok ? 'phase2' : 'phase1_feedback';
          if (state.phase === 'phase2') hidePhase1InputForAntiCheat();
          render();
        };

        const toP2 = document.getElementById('toP2');
        if (toP2) toP2.onclick = () => {
          state.phase = 'phase2';
          hidePhase1InputForAntiCheat();
          render();
        };

        const retryP1 = document.getElementById('retryP1');
        if (retryP1) retryP1.onclick = () => {
          state.userAnswerPhase1 = [];
          state.phase1Feedback = Array(state.currentQuestion.answerSeqPhase1.length).fill(null);
          state.phase = 'phase1';
          render();
        };

        const viewSolutionP1 = document.getElementById('viewSolutionP1');
        if (viewSolutionP1) viewSolutionP1.onclick = () => { state.showSolution = true; render(); };

        const p2Input = document.getElementById('phase2Input');
        if (p2Input) p2Input.oninput = (e) => { state.userAnswerPhase2 = e.target.value.toUpperCase(); };
        panelEl.querySelectorAll('[data-p2emoji]').forEach((b) => b.onclick = () => { state.userAnswerPhase2 = b.dataset.p2emoji; });

        const submitP2 = document.getElementById('submitP2');
        if (submitP2) submitP2.onclick = () => {
          state.attemptsPhase2 += 1;
          const p2ok = validatePhase2();
          state.phase2Feedback = p2ok ? 'ok' : 'bad';
          state.phase = 'phase2_feedback';

          const p1ok = validatePhase1();
          const whole = p1ok && p2ok;
          state.stats.total += 1;
          state.stats.correct += whole ? 1 : 0;
          state.stats.streak = whole ? state.stats.streak + 1 : 0;
          state.stats.perTypeTotalCount[state.trainingType] += 1;
          state.stats.perTypeCorrectCount[state.trainingType] += whole ? 1 : 0;
          render();
        };

        const retryP2 = document.getElementById('retryP2');
        if (retryP2) retryP2.onclick = () => { state.userAnswerPhase2 = ''; state.phase2Feedback = null; state.phase = 'phase2'; render(); };

        const viewSolutionP2 = document.getElementById('viewSolutionP2');
        if (viewSolutionP2) viewSolutionP2.onclick = () => { state.showSolution = true; render(); };

        const nextQ = document.getElementById('nextQ');
        if (nextQ) nextQ.onclick = () => nextQuestion();
      }

      // ========================
      // showing flow
      // ========================
      function runShowing() {
        if (state.showingTimer) clearInterval(state.showingTimer);
        const q = state.currentQuestion;
        if (q.type === 'emoji') {
          let idx = 0;
          stageCharEl.textContent = q.originalSeq[0];
          state.showingTimer = setInterval(() => {
            idx += 1;
            if (idx >= q.originalSeq.length) {
              clearInterval(state.showingTimer);
              state.phase = 'phase1';
              state.showIndex = -1;
              render();
              return;
            }
            stageCharEl.textContent = q.originalSeq[idx];
          }, 900);
        } else {
          stageCharEl.textContent = q.originalSeq.join('');
          setTimeout(() => {
            state.phase = 'phase1';
            stageCharEl.textContent = '•';
            render();
          }, 2000);
        }
      }

      function render() {
        renderTabs();
        renderStage();
        renderPanel();
      }

      // init
      resetQuestion();
      render();
      runShowing();
    </script>
  </body>
</html>
