<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premium Scratch Card</title>
    <link rel="stylesheet" href="styles/scratch-card.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="card-stage" aria-label="刮刮乐卡片">
        <article class="premium-card" id="scratchCard">
          <div class="card-surface" aria-hidden="true">
            <div class="surface-noise"></div>
            <div class="surface-lines"></div>
            <div class="surface-orb"></div>
          </div>

          <div class="card-content" id="cardContent">
            <span class="currency">￥</span>
            <strong class="amount" id="rewardAmount">5</strong>
          </div>

          <canvas id="scratchCanvas" class="scratch-layer" aria-label="可刮开遮罩"></canvas>
          <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>
        </article>
      </section>
    </main>

    <script src="scripts/scratch-card.js"></script>
  </body>
</html>
